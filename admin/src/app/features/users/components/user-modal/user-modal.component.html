<dialog
  #dialog
  [class]="'user-modal ' + sizeClass()"
  [attr.aria-labelledby]="titleId"
  (cancel)="onCancel($event)"
  (click)="onBackdropClick($event)"
>
  <div class="user-modal__surface">
    <header class="user-modal__header">
      <div class="user-modal__heading">
        <h2 [id]="titleId">{{ title() }}</h2>
        @if (subtitle()) {
          <p>{{ subtitle() }}</p>
        }
      </div>
      <button class="user-modal__close" type="button" aria-label="Đóng hộp thoại" (click)="close()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </header>
    <div class="user-modal__body">
      <ng-content />
    </div>
    <footer class="user-modal__footer">
      <ng-content select="[modalFooter]" />
    </footer>
  </div>
</dialog>
