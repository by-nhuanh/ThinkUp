<div class="range-field">
  <span class="range-label">{{ label() }}</span>
  <button
    class="range-trigger"
    type="button"
    [class.has-value]="hasValue()"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="label() + ' — chọn khoảng thời gian'"
    aria-haspopup="dialog"
    aria-controls="user-range-popover"
    (click)="toggle()"
  >
    <svg class="range-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <rect x="3" y="4.5" width="18" height="16" rx="2.5" />
      <path d="M8 3v3M16 3v3M3 9.5h18" />
    </svg>
    <span class="range-value">{{ displayLabel() }}</span>
    <svg class="range-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path d="m6 9 6 6 6-6" />
    </svg>
  </button>

  @if (open()) {
    <div
      id="user-range-popover"
      class="range-popover"
      role="dialog"
      aria-label="Chọn khoảng thời gian"
      [style.visibility]="popoverPosition() ? null : 'hidden'"
      [style.left.px]="popoverPosition()?.left ?? 12"
      [style.top.px]="popoverPosition()?.top ?? 12"
      [style.max-height.px]="popoverPosition()?.maxHeight ?? 420"
    >
      <div class="range-presets" role="group" aria-label="Khoảng thời gian nhanh">
        @for (preset of presets; track preset.key) {
          <button type="button" [attr.aria-pressed]="activePreset() === preset.key" (click)="applyPreset(preset.key)">
            {{ preset.label }}
          </button>
        }
      </div>

      <div class="range-inputs">
        <label>
          <span>Từ ngày</span>
          <input type="date" [value]="fromDraft()" (change)="onInput('from', $event)" />
        </label>
        <label>
          <span>Đến ngày</span>
          <input type="date" [value]="toDraft()" (change)="onInput('to', $event)" />
        </label>
      </div>

      <footer class="range-footer">
        <button class="btn btn--outline btn--sm" type="button" (click)="reset()">Đặt lại</button>
        <button class="btn btn--primary btn--sm" type="button" (click)="apply()">Áp dụng</button>
      </footer>
    </div>
  }
</div>
