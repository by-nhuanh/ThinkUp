<div class="pe-root" [class.is-overlay]="isExpired()">
  @if (!isExpired()) {
    <app-auth-brand-bar />
  }

  <main class="pe-body">
    <section class="pe-card" [class.is-expired]="isExpired()" aria-labelledby="pe-title" aria-describedby="pe-message">
      <span class="pe-icon" aria-hidden="true">!</span>
      <h1 id="pe-title" class="pe-title">{{ title }}</h1>
      <p id="pe-message" class="pe-message">{{ message }}</p>

      <div class="pe-actions">
        @if (!isExpired()) {
          <button class="pe-button pe-ghost" type="button" (click)="remindLater()">Nhắc nhở tôi sau</button>
        }
        <button class="pe-button pe-primary" type="button" (click)="changePassword()">Đổi mật khẩu</button>
      </div>
    </section>
  </main>
</div>
