<p class="strength-label" aria-live="polite">
  <span>Độ mạnh mật khẩu</span>@if (level() > 0) {<strong [attr.data-tone]="tone()">: {{ label() }}</strong>}
</p>

<div class="strength-bars" aria-hidden="true">
  @for (bar of bars; track bar) {
    <span class="strength-bar" [attr.data-on]="bar <= level()" [attr.data-tone]="tone()"></span>
  }
</div>

@if (hint()) {
  <p class="strength-hint" [attr.data-tone]="tone()">{{ hint() }}</p>
}
