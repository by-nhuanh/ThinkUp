<app-admin-dialog [title]="log().evidenceName" subtitle="Tệp bằng chứng đính kèm · Chỉ xem" size="lg" (closed)="closed.emit()">
  <div class="evidence-workspace">
    <div class="evidence-toolbar">
      <span>Trang 1 / 1</span>
      <div class="evidence-zoom">
        <button class="icon-button" type="button" aria-label="Thu nhỏ" [disabled]="zoom() <= 50" (click)="zoomBy(-10)">−</button>
        <span>{{ zoomLabel() }}</span>
        <button class="icon-button" type="button" aria-label="Phóng to" [disabled]="zoom() >= 200" (click)="zoomBy(10)">+</button>
      </div>
    </div>

    <div class="evidence-viewport">
      <div class="evidence-scale" [style.width.%]="zoom()">
        <article class="preview-doc">
          <header>
            <strong>BIÊN BẢN ĐỐI SOÁT LỆNH RÚT TIỀN</strong>
            <span>Tệp bằng chứng đính kèm bản ghi kiểm toán</span>
          </header>
          <p class="doc-pre">{{ docHeading() }}</p>
          <p class="doc-pre">{{ docAmounts() }}</p>
          <p>Đã đối chiếu thông tin và số dư ví của giảng viên.<br />Người đối soát: {{ log().actorName }}.</p>
          <p class="doc-watermark">BẢN XEM TRƯỚC MINH HỌA</p>
        </article>
      </div>
    </div>

    <div class="dialog-actions" dialogFooter>
      <button class="secondary-button" type="button" (click)="closed.emit()">Đóng cửa sổ</button>
    </div>
  </div>
</app-admin-dialog>
