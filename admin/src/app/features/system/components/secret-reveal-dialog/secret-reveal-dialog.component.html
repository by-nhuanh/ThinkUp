<app-admin-dialog
  title="Xác thực để xem khóa bí mật"
  subtitle="Nhập lại mật khẩu phiên làm việc hiện tại của Super Admin."
  icon="M12 3 4.5 6.2v5.6c0 4.3 3.2 7.8 7.5 9.2 4.3-1.4 7.5-4.9 7.5-9.2V6.2L12 3Z M14.6 9.7a2.6 2.6 0 1 0-3.6 2.4v3.1a1 1 0 0 0 2 0v-3.1a2.6 2.6 0 0 0 1.6-2.4Z"
  size="xl"
  (closed)="closed.emit()"
>
  <div class="system-form">
    <div class="notice info has-icon">
      <svg class="notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6.2v5.6c0 4.3 3.2 7.8 7.5 9.2 4.3-1.4 7.5-4.9 7.5-9.2V6.2L12 3Z" /><path d="m9 11.9 2.1 2.1 4-4" /></svg>
      <div class="notice-body">
        <strong>Bảo vệ thông tin kết nối thanh toán</strong>
        <p>Mật khẩu bí mật chỉ được hiển thị sau khi xác minh danh tính của bạn.</p>
      </div>
    </div>

    <label class="field" [class.invalid]="!!error()">
      <span>Mật khẩu phiên hiện tại <span class="required-mark">*</span></span>
      <input
        type="password"
        autocomplete="current-password"
        [value]="password()"
        (input)="password.set($any($event.target).value); error.set('')"
        autofocus
      />
      @if (error()) {
        <p class="field-error" role="alert">{{ error() }}</p>
      } @else {
        <small>Sử dụng mật khẩu của tài khoản Super Admin đang đăng nhập.</small>
      }
    </label>
  </div>

  <div dialogFooter class="dialog-actions">
    <button class="ghost-button" type="button" (click)="closed.emit()">Hủy</button>
    <button class="primary-button" type="button" (click)="submit()">Xác thực và xem khóa</button>
  </div>
</app-admin-dialog>
