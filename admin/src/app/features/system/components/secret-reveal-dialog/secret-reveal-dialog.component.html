<app-admin-dialog
  title="Xác thực để xem khóa bí mật"
  subtitle="Nhập lại mật khẩu phiên làm việc hiện tại của Super Admin."
  size="sm"
  (closed)="closed.emit()"
>
  <div class="system-form">
    <div class="notice info">
      <strong>Bảo vệ thông tin kết nối thanh toán</strong>
      Mật khẩu bí mật chỉ được hiển thị sau khi xác minh danh tính của bạn.
    </div>
    <label class="field" [class.invalid]="!!error()">
      <span>Mật khẩu phiên hiện tại <span class="required-mark">*</span></span>
      <input
        type="password"
        autocomplete="current-password"
        [value]="password()"
        (input)="password.set($any($event.target).value); error.set('')"
        autofocus
      />
      <small>Sử dụng mật khẩu của tài khoản Super Admin đang đăng nhập.</small>
      @if (error()) {
        <p class="field-error" role="alert">{{ error() }}</p>
      }
    </label>
  </div>
  <div dialogFooter class="dialog-actions">
    <button class="ghost-button" type="button" (click)="closed.emit()">Hủy</button>
    <button class="primary-button" type="button" (click)="submit()">Xác thực và xem khóa</button>
  </div>
</app-admin-dialog>
