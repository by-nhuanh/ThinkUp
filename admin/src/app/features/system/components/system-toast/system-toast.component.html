@if (toast.message()) {
  <div [class]="'system-toast ' + toast.kind()" role="status" aria-live="polite">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @switch (toast.kind()) {
        @case ('success') {
          <circle cx="12" cy="12" r="8.6" />
          <path d="m8.4 12.2 2.4 2.4 4.8-4.8" />
        }
        @case ('error') {
          <path d="M10.3 3.9 2.5 17.4a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
          <path d="M12 9.4v4.2" />
          <path d="M12 17h.01" />
        }
        @default {
          <circle cx="12" cy="12" r="8.6" />
          <path d="M12 11.2v5" />
          <path d="M12 7.9h.01" />
        }
      }
    </svg>
    <div class="toast-body">
      <strong>{{ toast.message() }}</strong>
      @if (toast.detail()) { <span>{{ toast.detail() }}</span> }
    </div>
  </div>
}
