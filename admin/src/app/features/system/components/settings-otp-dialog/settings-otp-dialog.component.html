<app-admin-dialog
  title="Xác thực lưu cấu hình"
  subtitle="Phê duyệt thay đổi trước khi áp dụng cấu hình mới vào hệ thống."
  icon="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"
  size="xl"
  (closed)="closed.emit()"
>
  <div class="system-form">
    <div class="notice info has-icon">
      <svg class="notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6.2v5.6c0 4.3 3.2 7.8 7.5 9.2 4.3-1.4 7.5-4.9 7.5-9.2V6.2L12 3Z" /><path d="m9 11.9 2.1 2.1 4-4" /></svg>
      <div class="notice-body">
        <strong>Xác nhận thay đổi cấu hình</strong>
        <p>Cấu hình chỉ được áp dụng sau khi mã OTP được xác thực thành công.</p>
      </div>
    </div>
    @if (serverError()) {
      <div class="notice danger has-icon" role="alert">
        <svg class="notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 2.5 17.4a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /><path d="M12 9.4v4.2" /><path d="M12 17h.01" /></svg>
        <div class="notice-body"><p>{{ serverError() }}</p></div>
      </div>
    }
    <label class="field" [class.invalid]="!!localError()">
      <span>Mã xác thực OTP <span class="required-mark">*</span></span>
      <app-system-otp-input
        [value]="otp()"
        [invalid]="!!localError()"
        [autofocus]="true"
        (valueChange)="onOtp($event)"
      />
      <small>Nhập mã OTP 6 chữ số của bạn để xác nhận lưu cấu hình.</small>
      @if (localError()) {
        <p class="field-error">{{ localError() }}</p>
      }
    </label>
  </div>
  <div dialogFooter class="dialog-actions">
    <button class="ghost-button" type="button" (click)="closed.emit()">Hủy</button>
    <button class="primary-button" type="button" (click)="submit()">Xác nhận lưu cấu hình</button>
  </div>
</app-admin-dialog>
