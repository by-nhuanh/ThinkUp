<app-admin-dialog
  [title]="title()"
  [subtitle]="subtitle()"
  [icon]="icon()"
  size="lg"
  (closed)="closed.emit()"
>
  <div class="system-form">
    <div [class]="'notice ' + resolvedTone() + ' has-icon'">
      <svg class="notice-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        @switch (resolvedTone()) {
          @case ('success') {
            <circle cx="12" cy="12" r="8.6" />
            <path d="m8.4 12.2 2.4 2.4 4.8-4.8" />
          }
          @default {
            <path d="M10.3 3.9 2.5 17.4a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
            <path d="M12 9.4v4.2" />
            <path d="M12 17h.01" />
          }
        }
      </svg>
      <div class="notice-body">
        <strong>{{ heading() }}</strong>
        @for (line of lines(); track line) {
          <p>{{ line }}</p>
        }
      </div>
    </div>

    @if (note()) {
      <p class="confirm-note">{{ note() }}</p>
    }
  </div>

  <div dialogFooter class="dialog-actions">
    <button class="ghost-button" type="button" (click)="closed.emit()">{{ cancelLabel() }}</button>
    <button [class]="danger() ? 'danger-button' : 'primary-button'" type="button" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
  </div>
</app-admin-dialog>
