<div class="search-field" [class.has-label]="floatLabel">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  @if (floatLabel && label) {
    <span class="search-field__label" aria-hidden="true">{{ label }}</span>
  }
  <input [attr.id]="inputId || null" type="search" [attr.aria-label]="label || null" [placeholder]="placeholder" [value]="value" (input)="onInput($event)">
</div>
