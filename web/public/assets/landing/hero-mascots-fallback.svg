<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 760" role="img" aria-labelledby="title desc">
<title id="title">Nhóm linh vật ThinkUp học tập</title><desc id="desc">Robot thân thiện cùng ba linh vật xanh, hồng và vàng học quanh laptop</desc>
<defs>
<linearGradient id="robot" x1=".2" y1="0" x2=".9" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#edf3ff"/><stop offset="1" stop-color="#98bce9"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8db6ff"/><stop offset=".55" stop-color="#2769ef"/><stop offset="1" stop-color="#074bbf"/></linearGradient>
<linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc2e2"/><stop offset="1" stop-color="#e747a3"/></linearGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff3a0"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#222d60"/><stop offset="1" stop-color="#080f2c"/></linearGradient>
<linearGradient id="laptop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b5c2e5"/><stop offset="1" stop-color="#555b9c"/></linearGradient>
<filter id="shadow" x="-35%" y="-50%" width="170%" height="200%"><feGaussianBlur stdDeviation="17"/></filter>
</defs>
<ellipse cx="527" cy="706" rx="447" ry="39" fill="#1e54a0" opacity=".22" filter="url(#shadow)"/>
<!-- blue learner -->
<g transform="translate(72 425)">
<ellipse cx="180" cy="209" rx="166" ry="38" fill="#1748aa" opacity=".24"/>
<path d="M35 167 Q-12 95 73 37 Q136 -20 203 30 Q287 61 293 144 Q318 213 237 241 Q188 254 162 240 Q109 267 74 232 Q10 229 35 167Z" fill="url(#blue)"/>
