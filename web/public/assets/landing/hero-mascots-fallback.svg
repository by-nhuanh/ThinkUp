<ellipse cx="161" cy="125" rx="19" ry="29"/><ellipse cx="220" cy="120" rx="19" ry="29"/>
<path d="M165 179 Q199 210 227 175" fill="#0c225b" stroke="#0c225b" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="265" cy="201" rx="44" ry="29" fill="#387cf8"/>
</g>
<!-- pink friend -->
<g transform="translate(650 243)">
