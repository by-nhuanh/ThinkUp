<path d="M781 697 Q837 678 892 697 Q938 679 983 693 L983 745 Q942 730 893 749 Q841 735 781 751Z" fill="#eff4ff" stroke="#3f78d6" stroke-width="8"/>
<path d="M893 698 V747 M808 712 H865 M916 712 H966" stroke="#8ab4e7" stroke-width="5"/>
</svg>