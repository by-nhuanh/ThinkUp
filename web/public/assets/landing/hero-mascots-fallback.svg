<ellipse cx="129" cy="110" rx="18" ry="26"/><ellipse cx="186" cy="107" rx="19" ry="27"/>
<path d="M130 170 Q161 208 195 169" fill="#b01269" stroke="#b01269" stroke-width="10" stroke-linecap="round"/>
<ellipse cx="77" cy="195" rx="34" ry="32" fill="#f46fb5"/><ellipse cx="232" cy="190" rx="36" ry="32" fill="#e957a7"/>
</g>
<!-- white and blue robot -->
<g transform="translate(319 124)">
<ellipse cx="189" cy="518" rx="190" ry="33" fill="#1e55b8" opacity=".18"/>
<rect x="94" y="343" width="197" height="185" rx="79" fill="url(#robot)" stroke="#a3c5f0" stroke-width="8"/>
<path d="M111 425 H271 V471 Q262 515 207 524 H176 Q121 518 111 471Z" fill="url(#blue)" opacity=".83"/>
<ellipse cx="191" cy="186" rx="189" ry="182" fill="url(#robot)" stroke="#e4f1ff" stroke-width="10"/>
<circle cx="17" cy="200" r="37" fill="#ffc42e" stroke="#e9a200" stroke-width="9"/><circle cx="365" cy="198" r="37" fill="#ffc42e" stroke="#e9a200" stroke-width="9"/>
<rect x="42" y="82" width="299" height="216" rx="98" fill="url(#screen)" stroke="#c6d9ff" stroke-width="11"/>
<path d="M91 185 Q130 118 167 184 M218 184 Q258 117 295 184" fill="none" stroke="#80d4ff" stroke-width="13" stroke-linecap="round"/>
<path d="M174 227 Q192 239 211 227" fill="none" stroke="#a9cafa" stroke-width="5" stroke-linecap="round"/>
<rect x="176" y="373" width="23" height="23" rx="5" fill="#1482ec"/><rect x="205" y="373" width="23" height="23" rx="5" fill="#1482ec"/><rect x="176" y="403" width="23" height="23" rx="5" fill="#1482ec"/><rect x="205" y="403" width="23" height="23" rx="5" fill="#1482ec"/>
<ellipse cx="110" cy="475" rx="53" ry="49" fill="url(#robot)"/><ellipse cx="272" cy="473" rx="54" ry="49" fill="url(#robot)"/>
</g>
