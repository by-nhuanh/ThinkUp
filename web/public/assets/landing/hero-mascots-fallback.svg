<g transform="translate(441 481)">
<path d="M0 0 L337 0 L303 193 L35 193Z" fill="url(#laptop)" stroke="#d7e5ff" stroke-width="7" stroke-linejoin="round"/>
<path d="M14 189 L313 189 L364 225 L-43 225Z" fill="#bac9ee" stroke="#e9f2ff" stroke-width="5"/>
<rect x="144" y="72" width="31" height="31" rx="7" fill="#fff"/><rect x="183" y="72" width="31" height="31" rx="7" fill="#fff"/><rect x="144" y="111" width="31" height="31" rx="7" fill="#fff"/><rect x="183" y="111" width="31" height="31" rx="7" fill="#fff"/>
</g>
<!-- yellow learner -->
<g transform="translate(734 487)">
<path d="M17 121 Q0 24 114 8 Q226 3 244 113 Q261 229 137 236 Q12 231 17 121Z" fill="url(#yellow)"/>
