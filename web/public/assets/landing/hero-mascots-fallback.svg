<path d="M120 164 Q151 202 187 161" stroke="#a86100" stroke-width="11" fill="none" stroke-linecap="round"/>
<ellipse cx="76" cy="155" rx="23" ry="21" fill="#ff9a38"/><ellipse cx="218" cy="147" rx="23" ry="20" fill="#ff9a38"/>
