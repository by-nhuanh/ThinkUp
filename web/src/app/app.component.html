
    <div class="flex flex-col min-h-screen" [class.study-room-lobby-shell]="isStudyLobby()">
      @if (!hideShell()) {
        @if (isAuthPage() || isOnboardingPage()) {
          <app-brand-only-header />
        } @else if (isStudyLobby()) {
          <app-study-room-header />
        } @else if (isMember()) {
          <app-member-header />
        } @else {
          <app-guest-header />
        }
      }
      <div class="flex-1 flex flex-col">
        <router-outlet />
      </div>
      @if (!isOnboardingPage() && !hideFooter() && !hideShell()) {
        <app-footer />
      }
      <app-toast />
      <app-instructor-card />
    </div>
