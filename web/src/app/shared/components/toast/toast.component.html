<div class="fixed top-4 right-4 z-[9999] flex flex-col gap-2 pointer-events-auto" role="status" aria-live="polite">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg backdrop-blur-sm max-w-[400px] w-full toast-item"
      [ngClass]="getStyle(toast.type)"
    >
      <!-- Icon based on type -->
      @switch (toast.type) {
        @case ('success') {
          <svg class="w-5 h-5 text-emerald-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        }
        @case ('error') {
          <svg class="w-5 h-5 text-red-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9" y1="9" x2="15" y2="15"/>
          </svg>
        }
        @case ('warning') {
          <svg class="w-5 h-5 text-amber-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        }
        @default {
          <svg class="w-5 h-5 text-blue-500 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        }
      }

      <p class="text-[13px] font-medium text-[#191B23] leading-[20px] flex-1 m-0">
        {{ toast.message }}
      </p>

      @if (toast.action; as action) {
        <button
          type="button"
          (click)="runAction(toast.id, action)"
          class="shrink-0 rounded-md px-2 py-1 text-[13px] font-semibold text-[#2563EB] transition-colors hover:bg-white/60 hover:text-[#1D4ED8]"
        >
          {{ action.label }}
        </button>
      }

      <button
        type="button"
        (click)="close(toast.id)"
        class="text-[#727785] hover:text-[#191B23] transition-colors shrink-0 p-1"
        aria-label="Đóng thông báo"
      >
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
