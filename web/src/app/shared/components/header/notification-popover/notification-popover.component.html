<div class="relative" data-notification-root>
  <button
    type="button"
    class="relative flex h-11 w-11 items-center justify-center rounded-full text-[#5B657A] transition-all duration-200 hover:bg-slate-100 hover:text-[#131927]"
    aria-label="Thông báo"
    aria-haspopup="dialog"
    aria-controls="header-notifications"
    [attr.aria-expanded]="open()"
    (click)="toggle()"
  >
    <img src="/assets/header/notification-bell.svg" alt="" width="26" height="26" />
    @if (unreadCount() > 0) {
      <span class="absolute right-[5px] top-[18px] size-2 rounded-full bg-[#EF4444]" aria-hidden="true"></span>
    }
  </button>

  @if (open()) {
    <div
      id="header-notifications"
      role="dialog"
      aria-label="Thông báo"
      class="absolute right-0 top-full z-[100] mt-2 flex h-[460px] w-[400px] max-w-[calc(100vw-2rem)] flex-col overflow-hidden rounded-2xl border border-[#E5E7EB] bg-white shadow-[0px_24px_28px_rgba(15,23,42,0.16)]"
    >
      <header class="flex h-[68px] shrink-0 items-center justify-between gap-4 px-5">
        <h3 class="text-[18px] font-semibold leading-6 text-[#111827]">Thông báo</h3>
        @if (unreadCount() > 0) {
          <button
            type="button"
            class="shrink-0 text-[13px] font-semibold leading-5 text-[#2563EB] transition-colors hover:text-[#1D4ED8] hover:underline"
            (click)="markAllRead()"
          >
            Đánh dấu đã đọc
          </button>
        }
      </header>

      <div class="min-h-0 flex-1 overflow-y-auto">
        @if (items().length === 0) {
          <div class="flex h-full flex-col items-center justify-center gap-3 px-6 text-center">
            <span class="flex size-12 items-center justify-center rounded-full bg-[#F1F5F9] text-[#94A3B8]">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                <path d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742" />
                <path d="m2 2 20 20" />
                <path d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05" />
              </svg>
            </span>
            <p class="text-[13px] leading-5 text-[#64748B]">Bạn chưa có thông báo nào.</p>
          </div>
        } @else {
          @for (item of items(); track item.id) {
            <button
              type="button"
              class="flex min-h-[104px] w-full items-start gap-3 px-5 py-4 text-left transition-colors hover:bg-[#F8FAFF]"
              [class.bg-[#F5F8FF]]="!item.readAt"
              (click)="openItem(item.id, item.href)"
            >
              <span
                class="flex size-10 shrink-0 items-center justify-center rounded-full"
                [style.background-color]="item.meta.background"
                [style.color]="item.meta.color"
                aria-hidden="true"
              >
                <app-notification-icon [kind]="item.kind" [size]="20" [strokeWidth]="1.8" />
              </span>

              <span class="min-w-0 flex-1">
                <span class="line-clamp-1 block text-[14px] font-semibold leading-5 text-[#111827]">{{
                  item.title
                }}</span>
                <span class="line-clamp-2 block text-[13px] leading-[18px] text-[#4B5563]">{{ item.message }}</span>
                <span class="mt-1 block text-[11px] leading-4 text-[#9CA3AF]">{{ item.relativeTime }}</span>
              </span>

              @if (!item.readAt) {
                <span class="mt-1.5 size-2 shrink-0 rounded-full bg-[#2563EB]" aria-label="Chưa đọc"></span>
              }
            </button>
          }
        }
      </div>

      <a
        routerLink="/main/notifications"
        class="flex h-[72px] shrink-0 items-center justify-center gap-2 border-t border-[#F1F5F9] text-[16px] font-semibold text-[#2563EB] transition-colors hover:bg-[#F8FAFF]"
        (click)="close()"
      >
        Xem tất cả thông báo
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </a>
    </div>
  }
</div>
