<div class="flex w-full flex-col gap-3 rounded-[10px] border border-[#E2E8F0] bg-white p-4">
  <form (ngSubmit)="submitSearch()" class="flex w-full flex-col gap-3 sm:flex-row sm:items-start">
    <div class="relative min-w-0 flex-1">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        name="query"
        placeholder="Tìm khóa học, giảng viên, chủ đề"
        class="h-[49px] w-full rounded-[8px] border border-[#E2E8F0] bg-[#F8FAFC] pl-11 pr-4 text-[16.8px] font-normal leading-[20.33px] text-[#0F172B] outline-none transition-colors placeholder:text-[#0F172B]/50 focus:border-[#2B7FFF] focus:bg-white"
      />
      <svg
        class="absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-[#90A1B9]"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.33"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </div>

    <button
      type="submit"
      class="flex h-[46px] shrink-0 items-center justify-center gap-2 rounded-[8px] bg-[#2B7FFF] px-6 text-[14px] font-medium leading-5 text-white transition-all hover:bg-[#1C66DF] active:scale-[0.98] sm:w-[133px]"
    >
      <svg
        class="h-4 w-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.33"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
      <span>Tìm kiếm</span>
    </button>
  </form>

  @if (suggestedTags.length > 0) {
    <div class="flex flex-wrap items-center gap-2">
      <span class="mr-0 text-[12px] font-normal leading-4 text-[#62748E]">Từ khóa gợi ý:</span>

      @for (tag of visibleTags(); track tag) {
        <button
          type="button"
          (click)="toggleTag(tag)"
          class="inline-flex h-6 items-center rounded-full px-3 py-1 text-[12px] font-normal leading-4 transition-colors"
          [ngClass]="selectedTags.includes(tag) ? 'bg-[#155DFC] text-white' : 'bg-[#EFF6FF] text-[#155DFC] hover:bg-[#DBEAFE]'"
        >
          {{ tag }}
        </button>
      }

      @if (hasMoreTags()) {
        <button
          type="button"
          (click)="toggleAllTags()"
          class="inline-flex h-6 items-center rounded-full bg-[#EFF6FF] px-3 py-1 text-[12px] font-normal leading-4 text-[#155DFC] transition-colors hover:bg-[#DBEAFE]"
          [attr.aria-label]="showAllTags() ? 'Thu gọn từ khóa gợi ý' : 'Xem thêm từ khóa gợi ý'"
        >
          {{ showAllTags() ? 'Thu gọn' : '...' }}
        </button>
      }
    </div>
  }
</div>
