<header class="tu-landing-header">
  <a class="tu-landing-header__brand" routerLink="/main" aria-label="ThinkUp – về trang chủ" (click)="closeMenu()">
    <!-- Same SVG geometry and fills as shared HeaderComponent. -->
    <svg class="tu-landing-header__logo" width="32.8" height="32" viewBox="0 0 33 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M8.11094 14.2222C12.1978 14.2222 15.5109 11.0385 15.5109 7.11111C15.5109 3.18375 12.1978 0 8.11094 0C4.02403 0 0.710938 3.18375 0.710938 7.11111C0.710938 11.0385 4.02403 14.2222 8.11094 14.2222Z" fill="#3898EC"/>
      <path d="M32.0891 0H17.2891V14.2222H32.0891V0Z" fill="#090909"/>
      <path d="M0.710938 15.6445H15.5109V32.0001L0.710938 15.6445Z" fill="#9BD1FF"/>
      <path d="M32.0891 22.9137V15.6445H24.6891H17.2891V32.0001H24.2996C28.6015 32.0001 32.0891 27.9319 32.0891 22.9137Z" fill="#257FE6"/>
    </svg>
    <span class="tu-landing-header__brand-text"><span class="tu-landing-header__think">THINK</span><span class="tu-landing-header__brand-accent">UP</span></span>
  </a>

  <nav class="tu-landing-header__nav" aria-label="Điều hướng trang chủ">
    @for (item of navItems; track item.href) {
      <a [routerLink]="item.href"
         routerLinkActive="tu-landing-header__nav-link--active"
         [routerLinkActiveOptions]="{exact: true}"
         class="tu-landing-header__nav-link">{{ item.label }}</a>
    }
  </nav>

  <div class="tu-landing-header__actions">
    <a routerLink="/main/cart" class="tu-landing-header__cart" aria-label="Xem giỏ hàng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M2 2h2l2.7 12.5a2 2 0 0 0 2 1.5h10a2 2 0 0 0 2-1.5L22 7H5"/>
      </svg>
      @if (cartCount() > 0) {
        <span class="tu-landing-header__cart-count">{{ cartCount() }}</span>
      }
    </a>
    <a routerLink="/auth/login" class="tu-landing-header__login">Đăng nhập</a>
    <a routerLink="/auth/sign-up" class="tu-landing-header__register">Đăng ký</a>
  </div>

  <div class="tu-landing-header__mobile-controls">
    <a routerLink="/main/cart" class="tu-landing-header__cart" aria-label="Xem giỏ hàng">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M2 2h2l2.7 12.5a2 2 0 0 0 2 1.5h10a2 2 0 0 0 2-1.5L22 7H5"/>
      </svg>
      @if (cartCount() > 0) {
        <span class="tu-landing-header__cart-count">{{ cartCount() }}</span>
      }
    </a>
    <button type="button" class="tu-landing-header__menu-toggle" [attr.aria-expanded]="menuOpen()" aria-controls="tu-guest-mobile-nav"
      [attr.aria-label]="menuOpen() ? 'Đóng menu' : 'Mở menu'"
      (click)="menuOpen.update(open => !open)">
      @if (menuOpen()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 5 19 19 M19 5 5 19"/></svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg>
      }
    </button>
  </div>

  @if (menuOpen()) {
    <nav id="tu-guest-mobile-nav" class="tu-landing-header__mobile-nav" aria-label="Điều hướng di động">
      @for (item of navItems; track item.href) {
        <a [routerLink]="item.href" (click)="closeMenu()">{{ item.label }}</a>
      }
      <div class="tu-landing-header__mobile-auth">
        <a routerLink="/auth/login" (click)="closeMenu()">Đăng nhập</a>
        <a routerLink="/auth/sign-up" (click)="closeMenu()">Đăng ký</a>
      </div>
    </nav>
  }
</header>
