<div
  class="fixed inset-0 z-[70] flex items-center justify-center bg-black/50 p-4 sm:p-6"
  role="presentation"
  (click)="closed.emit()"
>
  <section
    class="flex max-h-[calc(100dvh-2rem)] w-full max-w-[552px] flex-col overflow-hidden rounded-[14px] border border-[#D7DEE8] bg-white shadow-[0_12px_30px_-6px_rgba(0,0,0,0.22)] sm:max-h-[calc(100dvh-3rem)]"
    role="dialog"
    aria-modal="true"
    aria-labelledby="report-modal-title"
    (click)="$event.stopPropagation()"
  >
    <header class="flex shrink-0 items-start justify-between gap-4 px-6 pt-6">
      <div class="min-w-0">
        <h2 id="report-modal-title" class="text-[20px] font-bold leading-[26px] text-[#0F172A]">Báo cáo nội dung</h2>
        <p class="mt-3 text-[13px] leading-5 text-[#475569]">Vui lòng chọn lý do bạn muốn báo cáo nội dung này:</p>
        @if (author) {
          <p class="mt-1 truncate text-[11px] leading-4 text-[#8FA3BF]">Nội dung của {{ author }}{{ content ? ': ' + content : '' }}</p>
        }
      </div>
      <button
        type="button"
        (click)="closed.emit()"
        class="grid h-7 w-7 shrink-0 place-items-center rounded-md text-[#334155] transition hover:bg-[#F1F5F9]"
        aria-label="Đóng"
      >
        <svg lucideX class="h-[13px] w-[13px]" aria-hidden="true"></svg>
      </button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto px-6 pb-1 pt-4">
      <div class="space-y-0.5">
        @for (reason of reasons; track reason.id) {
          <label
            class="-mx-2 flex cursor-pointer items-center gap-3.5 rounded-xl border px-2 py-2 transition"
            [class]="
              selectedReasonId === reason.id
                ? 'border-[#BFD4FF] bg-[#F6F9FF]'
                : 'border-transparent hover:bg-[#F8FAFC]'
            "
          >
            <input
              type="radio"
              name="report-reason"
              class="peer sr-only"
              [value]="reason.id"
              [checked]="selectedReasonId === reason.id"
              (change)="selectReason(reason.id)"
            />
            <span
              class="grid h-[18px] w-[18px] shrink-0 place-items-center rounded-full border-[1.5px] transition peer-focus-visible:ring-2 peer-focus-visible:ring-[#0B73FF]/30 peer-focus-visible:ring-offset-2"
              [class]="selectedReasonId === reason.id ? 'border-[#0B73FF]' : 'border-[#A8B4C5]'"
              aria-hidden="true"
            >
              @if (selectedReasonId === reason.id) {
                <span class="h-2 w-2 rounded-full bg-[#0B73FF]"></span>
              }
            </span>

            <span
              class="grid h-10 w-10 shrink-0 place-items-center rounded-full"
              [class]="
                reason.tone === 'danger'
                  ? 'bg-[#FFEEF0] text-[#FF4D5E]'
                  : reason.tone === 'spam'
                    ? 'bg-[#FFF0E8] text-[#F97316]'
                    : reason.tone === 'warning'
                      ? 'bg-[#FFF7D8] text-[#F59E0B]'
                      : reason.tone === 'copyright'
                        ? 'bg-[#F1E9FF] text-[#7C3AED]'
                        : reason.tone === 'harassment'
                          ? 'bg-[#EAF2FF] text-[#2563EB]'
                          : 'bg-[#EEF2F7] text-[#64748B]'
              "
              aria-hidden="true"
            >
              @switch (reason.tone) {
                @case ('danger') {
                  <svg lucideCircleAlert class="h-4 w-4" aria-hidden="true"></svg>
                }
                @case ('spam') {
                  <svg lucideMail class="h-4 w-4" aria-hidden="true"></svg>
                }
                @case ('warning') {
                  <svg lucideTriangleAlert class="h-4 w-4" aria-hidden="true"></svg>
                }
                @case ('copyright') {
                  <svg lucideCopyright class="h-4 w-4" aria-hidden="true"></svg>
                }
                @case ('harassment') {
                  <svg lucideUserRound class="h-4 w-4" aria-hidden="true"></svg>
                }
                @default {
                  <svg lucideEllipsis class="h-4 w-4" aria-hidden="true"></svg>
                }
              }
            </span>

            <span class="ml-0.5 min-w-0 flex-1">
              <span class="block text-[13px] font-semibold leading-[18px] text-[#1F2937]">{{ reason.label }}</span>
              <span class="mt-0.5 block text-[11px] leading-4 text-[#64748B]">{{ reason.description }}</span>
            </span>
          </label>
        }
      </div>

      <div class="mt-2">
        <label for="report-detail" class="text-[13px] font-semibold leading-5 text-[#1F2937]">
          Mô tả chi tiết <span class="text-[#F00A0E]">*</span>
        </label>
        <textarea
          id="report-detail"
          name="detail"
          rows="3"
          maxlength="500"
          [(ngModel)]="detail"
          (ngModelChange)="error = ''"
          placeholder="Vui lòng cung cấp thêm thông tin để chúng tôi có thể xem xét..."
          class="mt-2 h-[78px] max-h-[168px] w-full resize-y rounded-lg border border-[#CBD5E1] px-4 py-3 text-[12px] leading-[18px] text-[#0F172A] outline-none transition placeholder:text-[#94A3B8] focus:border-[#0B73FF] focus:ring-2 focus:ring-[#0B73FF]/10"
        ></textarea>
        <p class="mt-1 text-right text-[11px] leading-4 text-[#A8B4C5]">{{ detail.length }}/500</p>
      </div>

      @if (error) {
        <p class="mt-1 text-[12px] leading-4 text-[#DC2626]">{{ error }}</p>
      }
    </div>

    <footer class="flex shrink-0 items-center gap-3.5 px-6 pb-6 pt-4">
      <button
        type="button"
        (click)="closed.emit()"
        class="h-[42px] flex-1 rounded-lg border border-[#D5DEE9] bg-white text-[14px] font-semibold leading-5 text-[#0B73FF] transition hover:bg-[#F6F9FF]"
      >
        Hủy
      </button>
      <button
        type="button"
        (click)="submit()"
        [disabled]="submitting"
        class="h-[42px] flex-1 rounded-lg bg-[#0B73FF] text-[14px] font-semibold leading-5 text-white transition hover:bg-[#0968E8] disabled:cursor-not-allowed disabled:bg-[#9CC7FF]"
      >
        Gửi báo cáo
      </button>
    </footer>
  </section>
</div>
