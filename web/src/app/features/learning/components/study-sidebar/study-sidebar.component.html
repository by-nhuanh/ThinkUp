<div class="flex h-full min-h-0">
  <!-- Vertical rail -->
  <nav class="flex w-12 shrink-0 flex-col items-center gap-1 border-r border-[#1D293D] bg-[#151823] py-3" aria-label="Điều hướng không gian học">
    <button
      type="button"
      (click)="toggle.emit()"
      class="grid h-9 w-9 place-items-center rounded text-white transition"
      [class]="open ? 'bg-[#1770F9]/[0.31]' : 'hover:bg-white/10'"
      [attr.aria-label]="open ? 'Ẩn nội dung khóa học' : 'Hiện nội dung khóa học'"
      [attr.aria-expanded]="open"
      title="Nội dung khóa học"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M10 5H3" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M12 19H3" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M14 3V7" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M16 17V21" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M21 12H12" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M21 19H16" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M21 5H14" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M8 10V14" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M8 12H3" stroke="currentColor" stroke-width="1.333" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </nav>

  @if (open) {
    <app-course-outline
      [course]="course"
      [activeLessonId]="activeLessonId"
      [openChapterIds]="openChapterIds"
      [previewMode]="previewMode"
      variant="default"
      (lessonSelected)="lessonSelected.emit($event)"
      (chapterToggled)="chapterToggled.emit($event)"
    />
  }
</div>
