<section class="flex h-full min-w-0 flex-col gap-5 rounded-2xl border border-[#E2E8F0] bg-white p-6">
  <div class="flex items-center justify-between gap-4">
    <h2 class="text-[18px] font-bold leading-7 text-[#111827]">Hoạt động gần đây</h2>
  </div>

  @if (activities.length) {
    <ul class="flex flex-col gap-4">
      @for (activity of activities; track activity.key) {
        <li class="flex min-h-[72px] items-center gap-3 xl:min-h-[88px]">
          <span
            class="h-2 w-2 shrink-0 rounded-full"
            [style.background-color]="toneColor(activity.tone)"
            aria-hidden="true"
          ></span>
          <div class="flex min-w-0 flex-col justify-center gap-1">
            <p class="text-[14px] leading-5 text-[#1F2937]">{{ activity.text }}</p>
            <p class="text-[12px] leading-4 text-[#64748B]">{{ activity.time }}</p>
          </div>
        </li>
      }
    </ul>
  } @else {
    <p class="py-10 text-center text-[14px] text-[#64748B]">Chưa có hoạt động nào.</p>
  }
</section>
