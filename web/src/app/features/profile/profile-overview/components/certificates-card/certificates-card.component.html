<section class="flex min-w-0 flex-col gap-4 rounded-2xl border border-[#E2E8F0] bg-white p-6">
  <div class="flex items-center justify-between gap-4">
    <h2 class="text-[18px] font-bold leading-7 text-[#111827]">
      Chứng chỉ đạt được ({{ total }})
    </h2>
    <a
      routerLink="/main/certificates"
      class="inline-flex h-8 items-center justify-center rounded-full px-3 text-[14px] leading-5 text-[#4A79FF] transition-colors hover:bg-[#F5F8FF]"
    >
      Xem tất cả
    </a>
  </div>

  @if (certificates.length) {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
      @for (certificate of certificates; track certificate.id) {
        <article class="flex h-[88px] min-w-0 items-center gap-3 rounded-xl border border-[#E2E8F0] bg-[#F8FAFC] px-4 xl:h-28">
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-[#EAF2FF] text-[#4A79FF]">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="6" />
              <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" />
            </svg>
          </span>
          <div class="flex min-w-0 flex-col gap-1">
            <p class="line-clamp-2 text-[14px] font-bold leading-5 text-[#111827]">{{ certificate.title }}</p>
            <p class="truncate text-[12px] leading-4 text-[#64748B]">Ngày cấp: {{ certificate.issuedAt }}</p>
          </div>
        </article>
      }
    </div>
  } @else {
    <p class="py-10 text-center text-[14px] text-[#64748B]">Bạn chưa có chứng chỉ nào.</p>
  }
</section>
