<section
  class="relative flex min-h-[119px] min-w-0 flex-col gap-5 overflow-hidden rounded-[24px] border border-[#E0E5EB] bg-white px-6 py-6 sm:flex-row sm:items-center sm:gap-6 lg:px-8"
>
  <div class="pointer-events-none absolute inset-0 bg-[linear-gradient(179deg,rgba(240,249,255,1)_0%,rgba(241,246,255,0)_50%,rgba(241,246,255,0)_100%)]"></div>

  <!-- Avatar + badge sửa ảnh -->
  <div class="relative z-10 shrink-0">
    <div class="absolute -inset-[3px] rounded-full bg-[linear-gradient(45deg,rgba(74,121,255,1)_0%,rgba(74,121,255,0)_100%)] opacity-40 blur-[3px]"></div>
    @if (profile.avatarUrl) {
      <img
        [src]="profile.avatarUrl"
        [alt]="'Ảnh đại diện của ' + profile.name"
        class="relative h-16 w-16 rounded-full bg-white object-cover ring-2 ring-white"
      />
    } @else {
      <div class="relative grid h-16 w-16 place-items-center rounded-full bg-[#E8EEFF] text-xl font-bold text-[#4A79FF] ring-2 ring-white">
        {{ (profile.name || 'U').trim().charAt(0).toUpperCase() }}
      </div>
    }
    <a
      routerLink="/main/profile/edit"
      class="absolute -bottom-0.5 -right-0.5 grid h-[18px] w-[18px] place-items-center rounded-full bg-[#4A79FF] text-white shadow-[0px_2px_3px_-2px_rgba(0,0,0,0.1),0px_5px_7.5px_-1.5px_rgba(0,0,0,0.1)]"
      aria-label="Chỉnh sửa ảnh đại diện"
      title="Chỉnh sửa ảnh đại diện"
    >
      <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
        <path d="m15 5 4 4" />
      </svg>
    </a>
  </div>

  <!-- Thông tin -->
  <div class="relative z-10 min-w-0 flex-1">
    <h1 class="truncate text-[clamp(22px,0.42vw+20px,28px)] font-semibold leading-[1.22] text-[#071123]">
      {{ profile.name }}
    </h1>
    <div class="mt-2 flex flex-wrap items-center gap-x-5 gap-y-1.5 text-[14px] leading-5 text-[#596475]">
      <span class="inline-flex min-w-0 items-center gap-1.5">
        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2" />
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
        </svg>
        <span class="truncate">{{ profile.email }}</span>
      </span>
      <span class="inline-flex items-center gap-1.5">
        <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v4" /><path d="M16 2v4" />
          <rect width="18" height="18" x="3" y="4" rx="2" /><path d="M3 10h18" />
        </svg>
        Tham gia {{ profile.joinedAt }}
      </span>
    </div>
  </div>

  <!-- CTA -->
  <a
    routerLink="/main/profile/edit"
    class="relative z-10 inline-flex h-9 shrink-0 items-center justify-center gap-2 rounded-full bg-[#4A79FF] px-5 text-[14px] leading-5 text-white shadow-[0px_1px_2px_-1px_rgba(0,0,0,0.1),0px_1px_3px_0px_rgba(0,0,0,0.1)] transition-colors hover:bg-[#3563E9] active:bg-[#244FD1]"
  >
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
      <path d="m15 5 4 4" />
    </svg>
    Chỉnh sửa hồ sơ
  </a>
</section>
