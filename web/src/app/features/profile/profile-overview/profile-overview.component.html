<div class="min-h-full bg-[#F9F9FF] text-[#071123]">
  <main class="mx-auto flex w-full min-w-0 max-w-[1920px] flex-1 flex-col gap-6 overflow-x-hidden px-[clamp(16px,3.33vw,64px)] py-6">
    <!-- Hero hồ sơ -->
    <app-profile-hero [profile]="profileService.profile()" />

    <!-- Nội dung 2 cột 35/65 -->
    <div class="grid min-w-0 grid-cols-1 gap-6 xl:grid-cols-[minmax(0,35fr)_minmax(0,65fr)]">
      <app-recent-activity-card [activities]="profileService.recentActivities()" />

      <div class="flex min-w-0 flex-col gap-6">
        <app-current-courses-card
          [courses]="profileService.currentCourses()"
          [completedCourses]="profileService.completedCourses()"
          [totalCompleted]="profileService.totalCompletedCourses()"
        />
        <app-certificates-card
          [certificates]="profileService.certificates()"
          [total]="profileService.totalCertificates()"
        />
      </div>
    </div>
  </main>
</div>
