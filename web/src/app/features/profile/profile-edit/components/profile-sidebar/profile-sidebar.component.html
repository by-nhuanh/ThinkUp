<aside class="flex h-full min-w-0 flex-col items-center gap-6 rounded-[18px] bg-white px-5 py-8 shadow-[0_1px_3px_rgba(0,0,0,0.1),0_1px_2px_-1px_rgba(0,0,0,0.1)] sm:px-8 xl:pb-12 xl:pt-8">
  <!-- Ảnh đại diện -->
  <div class="relative shrink-0">
    @if (avatarUrl) {
      <img
        [src]="avatarUrl"
        [alt]="'Ảnh đại diện của ' + displayName"
        class="h-24 w-24 rounded-full bg-[#F1F5F9] object-cover ring-1 ring-[#E2E8F0] xl:h-32 xl:w-32"
      />
    } @else {
      <div class="grid h-24 w-24 place-items-center rounded-full bg-[#E8EEFF] text-3xl font-bold text-[#4A79FF] ring-1 ring-[#E2E8F0] xl:h-32 xl:w-32">
        {{ (displayName || 'U').trim().charAt(0).toUpperCase() }}
      </div>
    }
  </div>

  <p class="max-w-full truncate text-center text-[16px] font-bold leading-6 text-[#1F293D] xl:text-[18px] xl:leading-7">
    {{ displayName }}
  </p>

  <!-- Nút tải ảnh -->
  <div class="w-full">
    <button
      type="button"
      [disabled]="isUploading"
      (click)="avatarPicker.click()"
      class="inline-flex h-10 w-full items-center justify-center rounded-full bg-[#00A2F0] px-4 text-[13px] font-bold leading-5 text-white transition-colors hover:bg-[#008FD5] disabled:cursor-not-allowed disabled:opacity-70"
    >
      @if (isUploading) {
        <span class="mr-2 h-3.5 w-3.5 animate-spin rounded-full border-2 border-white/40 border-t-white" aria-hidden="true"></span>
      }
      Tải Ảnh Đại Diện Mới
    </button>
    <input
      #avatarPicker
      type="file"
      accept="image/jpeg,image/png,image/webp"
      class="hidden"
      aria-label="Chọn ảnh đại diện mới"
      (change)="onFileInput($event)"
    />

    <p class="mt-3 text-center text-[12px] leading-4 text-[#636E7D]">
      Chỉ hỗ trợ JPG, PNG, WEBP.<br />Dung lượng tối đa 2MB.
    </p>

    @if (errorMessage) {
      <p class="mt-2 text-center text-[12px] leading-4 text-[#BA2121]" role="alert">{{ errorMessage }}</p>
    }
  </div>
</aside>
