<div class="min-h-full bg-[#F9F9FF]">
  <main class="mx-auto w-full min-w-0 max-w-[1920px] px-[clamp(16px,2.55vw,49px)] py-6">
    <div class="grid min-w-0 grid-cols-1 gap-6 xl:grid-cols-[minmax(260px,413fr)_minmax(0,1372fr)]">
      <app-profile-sidebar
        [displayName]="displayName()"
        [avatarUrl]="avatarUrl()"
        [errorMessage]="avatarError()"
        [isUploading]="isUploading()"
        (fileSelected)="onAvatarSelected($event)"
      />

      <app-profile-form
        [profile]="profileService.profile()"
        [isSaving]="isSaving()"
        [externalDirty]="avatarDirty()"
        (stateChange)="onFormState($event)"
        (save)="onSave($event)"
        (cancel)="onCancel()"
      />
    </div>
  </main>

  @if (modal() === 'success') {
    <app-status-modal
      variant="success"
      title="Cập nhật hồ sơ thành công!"
      primaryLabel="Đóng"
      (primary)="onSuccessClose()"
      (dismissed)="onSuccessClose()"
    />
  }

  @if (modal() === 'error') {
    <app-status-modal
      variant="error"
      title="Lưu thông tin thất bại. Vui lòng kiểm tra lại kết nối!"
      primaryLabel="Đóng"
      (primary)="onErrorClose()"
      (dismissed)="onErrorClose()"
    />
  }

  @if (unsaved.isOpen()) {
    <app-status-modal
      variant="warning"
      title="Những thay đổi của bạn chưa được lưu. Bạn có chắc muốn rời đi?"
      primaryLabel="Tiếp tục chỉnh sửa"
      secondaryLabel="Rời đi"
      (primary)="onWarningPrimary()"
      (secondary)="onWarningSecondary()"
      (dismissed)="onWarningPrimary()"
    />
  }
</div>
