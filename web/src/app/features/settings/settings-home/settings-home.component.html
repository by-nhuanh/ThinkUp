<div class="min-h-full bg-[#F9F9FF] text-[#071123]">
  <main class="mx-auto flex w-full min-w-0 max-w-[1920px] flex-1 flex-col gap-12 overflow-x-hidden px-[clamp(16px,3.33vw,64px)] py-6">
    <header class="flex flex-col gap-1">
      <h1 class="text-[24px] font-bold leading-8 text-[#0F172B]">Cài đặt</h1>
      <p class="text-[14px] leading-5 text-[#62748E]">
        Quản lý thông tin cá nhân và cách bạn xuất hiện trên ThinkUp
      </p>
    </header>

    <div class="flex flex-col gap-12">
      @for (section of sections | async; track section.id) {
        <app-settings-section-card [section]="section" (manage)="open(section)" />
      }
    </div>
  </main>
</div>
