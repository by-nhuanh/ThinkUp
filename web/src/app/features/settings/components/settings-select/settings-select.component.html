<div class="relative">
  <button
    #trigger
    type="button"
    class="flex h-11 w-full items-center justify-between gap-2 rounded-[10px] border border-[#E2E8F0] bg-white px-[14px] text-left text-[14px] leading-5 text-[#314158] transition hover:border-[#BEDBFF] focus:border-[#155DFC] focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="disabled()"
    (click)="toggle()"
    [attr.aria-expanded]="open()"
    aria-haspopup="listbox"
  >
    <span class="truncate">{{ selectedLabel() || placeholder() }}</span>
    <svg
      lucideChevronDown
      [size]="16"
      [strokeWidth]="2"
      class="shrink-0 text-[#90A1B9] transition-transform duration-200"
      [class.rotate-180]="open()"
    ></svg>
  </button>

  @if (open()) {
    <div
      role="listbox"
      class="settings-select__panel fixed z-[100] rounded-[10px] border border-[#E2E8F0] bg-white py-1 shadow-lg"
      [style.top.px]="position().top"
      [style.left.px]="position().left"
      [style.width.px]="position().width"
      [style.maxHeight.px]="position().maxHeight"
      [style.overflow-y]="position().scrollable ? 'auto' : 'visible'"
    >
      @for (option of options(); track option.value) {
        <button
          type="button"
          role="option"
          class="flex w-full items-center justify-between gap-2 px-[14px] py-2.5 text-left text-[14px] leading-5 text-[#314158] transition hover:bg-[#F9F9FF]"
          [attr.aria-selected]="option.value === value()"
          (click)="onOption(option.value)"
        >
          <span class="truncate">{{ option.label }}</span>
          @if (option.value === value()) {
            <svg lucideCheck [size]="16" [strokeWidth]="2" class="shrink-0 text-[#155DFC]"></svg>
          }
        </button>
      }
    </div>
  }
</div>
